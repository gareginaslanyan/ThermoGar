<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>ThermoGar</title>
<style>
  html,body{margin:0;height:100%;background:#F8F8F9;color:#232529;
    font-family:"Segoe UI",system-ui,sans-serif;font-size:18px}
  .wrap{height:100%;display:flex;align-items:center;justify-content:center}
  .box{text-align:center;max-width:520px;padding:0 24px}
  h1{font-size:22px;font-weight:600;margin:0 0 12px}
  p{margin:0;color:#4B4F56;line-height:1.5}
  .bar{width:220px;height:4px;background:#ECEDEF;border-radius:2px;
    margin:24px auto 0;overflow:hidden}
  .bar i{display:block;height:100%;width:40%;background:#1F60C1;border-radius:2px;
    animation:slide 1.4s ease-in-out infinite}
  @keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}
</style>
</head>
<body>
  <div class="wrap"><div class="box">
    <h1>ThermoGar</h1>
    <p>Запускаем расчётное ядро и разбираем термодинамическую базу.
       Первый запуск после установки занимает около минуты.</p>
    <div class="bar"><i></i></div>
  </div></div>
</body>
</html>
