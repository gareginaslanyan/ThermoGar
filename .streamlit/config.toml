[theme]
baseFontSize = 18
headingFontSizes = ["31px", "22px", "22px", "18px", "18px", "18px"]
chartCategoricalColors = ["#0D2768", "#4587DE", "#000000", "#D55E00", "#009E73", "#CC79A7", "#0072B2"]
