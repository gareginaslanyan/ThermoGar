[theme]
baseFontSize = 18
headingFontSizes = ["31px", "22px", "22px", "18px", "18px", "18px"]
chartSequentialColors = ["#00224E", "#123570", "#3B496C", "#575D6D", "#707173", "#8A8678", "#A59C74", "#C3B369", "#E1CC55", "#FEE838"]
