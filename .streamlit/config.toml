secondaryBackgroundColor = "#ECEDEF"
textColor = "#232529"
linkColor = "#133B8B"
borderColor = "#CFD1D5"
dataframeBorderColor = "#CFD1D5"
codeBackgroundColor = "#FFFFFF"
redColor = "#C93425"
redBackgroundColor = "#FDF0EE"
redTextColor = "#A62A1E"
yellowColor = "#5A4500"
yellowBackgroundColor = "#FFF6D6"
yellowTextColor = "#232529"
greenColor = "#146C33"
greenBackgroundColor = "#EFFAF4"
greenTextColor = "#146C33"
blueColor = "#1F60C1"
blueBackgroundColor = "#EFF6FA"
blueTextColor = "#133B8B"
grayColor = "#79808B"
grayBackgroundColor = "#ECEDEF"
grayTextColor = "#4B4F56"
