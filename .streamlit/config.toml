redTextColor = "#F5A79F"
yellowColor = "#E8B200"
yellowBackgroundColor = "#2E2609"
yellowTextColor = "#F1EFEA"
greenColor = "#3FBE77"
greenBackgroundColor = "#15281E"
greenTextColor = "#8FE0B4"
blueColor = "#5C97E8"
blueBackgroundColor = "#16233B"
blueTextColor = "#9CC0F2"
grayColor = "#8A857A"
grayBackgroundColor = "#2C2822"
