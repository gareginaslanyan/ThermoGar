showSidebarBorder = true

[theme.light]
primaryColor = "#1F60C1"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F1EFEA"
textColor = "#2A2722"
linkColor = "#133B8B"
borderColor = "#D8D4CC"
dataframeBorderColor = "#D8D4CC"
codeBackgroundColor = "#F1EFEA"
redColor = "#C93425"
redBackgroundColor = "#FDF0EE"
redTextColor = "#A62A1E"
yellowColor = "#5A4500"
yellowBackgroundColor = "#FFF6D6"
yellowTextColor = "#2A2722"
greenColor = "#146C33"
greenBackgroundColor = "#EFFAF4"
greenTextColor = "#146C33"
blueColor = "#1F60C1"
blueBackgroundColor = "#EFF6FA"
blueTextColor = "#133B8B"
grayColor = "#8A857A"
grayBackgroundColor = "#F1EFEA"
grayTextColor = "#57534A"
showWidgetBorder = false

[theme.dark]
primaryColor = "#5C97E8"
backgroundColor = "#1A1816"
secondaryBackgroundColor = "#24211D"
textColor = "#F1EFEA"
linkColor = "#9CC0F2"
