greenTextColor = "#8FE0B4"
blueColor = "#5C97E8"
blueBackgroundColor = "#16233B"
blueTextColor = "#9CC0F2"
grayColor = "#8A92A0"
grayBackgroundColor = "#25292F"
grayTextColor = "#BCC2CD"
